<!DOCTYPE html>
<html lang="en">
<head>
<body>
  <main class="stage">
      <div class="side-button mute"></div><div class="side-button volume-up"></div><div class="side-button volume-down"></div><div class="side-button power"></div>
      <div class="screen">
        <div class="wallpaper"></div>
        <div class="status-bar"><span id="statusTime">9:41</span><div class="dynamic-island"></div><div class="status-icons"><span>▮▮▮</span><span>◉</span><span class="battery"><i></i></span></div></div>
        <section id="lockScreen" class="lock-screen">
          <div class="lock-top"><span class="tiny-lock">⌑</span><span>Swipe up to unlock</span></div>
          <div class="lock-clock" id="lockClock">9:41</div>
          <div class="lock-date" id="lockDate">Wednesday, October 21</div>
          <div class="lock-bottom">
            <div class="lock-message"><span class="message-icon">✦</span><div><b>Welcome back</b><small>Enter your passcode to continue</small></div></div>
            <div class="passcode-title">Enter Passcode</div>
            <div class="dots" aria-label="Passcode digits"><i></i><i></i><i></i><i></i></div>
            <div id="pinError" class="pin-error" aria-live="polite"></div>
            <div class="keypad" id="keypad">
              <button data-digit="1">1</button><button data-digit="2">2<small>ABC</small></button><button data-digit="3">3<small>DEF</small></button>
              <button data-digit="4">4<small>GHI</small></button><button data-digit="5">5<small>JKL</small></button><button data-digit="6">6<small>MNO</small></button>
              <button data-digit="7">7<small>PQRS</small></button><button data-digit="8">8<small>TUV</small></button><button data-digit="9">9<small>WXYZ</small></button>
              <span></span><button data-digit="0">0</button><button id="deleteDigit" class="delete-key" aria-label="Delete last digit">⌫</button>
            </div>
            <div class="emergency-row"><button id="emergencyButton">Emergency</button><button id="cancelPin">Cancel</button></div>
          </div>
        </section>
        <section id="homeScreen" class="home-screen hidden" aria-label="Home screen">
          <div class="home-date"><span id="homeClock">9:41</span><span>Wednesday, October 21</span></div>
          <div class="app-grid">
            <button class="app-icon" data-app="instagram"><span class="icon-art instagram">◎</span><span>Instagram</span></button>
            <button class="app-icon" data-app="photos"><span class="icon-art photos">🌈</span><span>Photos</span></button>
            <button class="app-icon" data-app="messages"><span class="icon-art messages">●</span><span>Messages</span></button>
            <button class="app-icon" data-app="camera"><span class="icon-art camera">◉</span><span>Camera</span></button>
            <button class="app-icon" data-app="settings"><span class="icon-art settings">⚙</span><span>Settings</span></button>
            <button class="app-icon" data-app="notes"><span class="icon-art notes">▤</span><span>Notes</span></button>
            <button class="app-icon" data-app="music"><span class="icon-art music">♫</span><span>Music</span></button>
            <button class="app-icon" data-app="calendar"><span class="icon-art calendar"><b>WED</b><strong>21</strong></span><span>Calendar</span></button>
          </div>
          <div class="dock">
            <button class="app-icon" data-app="phone"><span class="icon-art phone-icon">☎</span></button>
            <button class="app-icon" data-app="messages"><span class="icon-art messages">●</span></button>
            <button class="app-icon" data-app="safari"><span class="icon-art safari">◉</span></button>
            <button class="app-icon" data-app="music"><span class="icon-art music">♫</span></button>
          </div>
          <div class="home-indicator"></div>
        </section>
        <section id="appView" class="app-view hidden">
          <header class="app-header"><button id="backHome" aria-label="Back to Home">‹</button><span id="appTitle">Instagram</span><button id="lockNow" aria-label="Lock phone">⌑</button></header>
          <div id="appContent" class="app-content"></div>
          <div class="home-indicator app-indicator"></div>
        </section>
      </div>
    </section>
    <p class="footnote">Demo passcode: <b>1809</b> · Tap the screen or enter digits on your keyboard.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
